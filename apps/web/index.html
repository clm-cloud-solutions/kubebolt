<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Content-Security-Policy: images load only from our own origin, data: and
       blob:. The chat renders Markdown that can include text the assistant read
       back from the cluster; images are rendered as text, and this header keeps
       the browser from fetching an external image if one ever reaches the DOM.
       Scoped to img-src on purpose: no default-src, so scripts, styles, fonts,
       the API and WebSockets are untouched and Vite HMR keeps working in dev. -->
  <meta http-equiv="Content-Security-Policy" content="img-src 'self' data: blob:" />

  <title>KubeBolt - Open-source Kubernetes operations</title>
  <meta name="description" content="KubeBolt is the open-source Kubernetes operations platform: health, topology, operations, cost and security in one place, with Kobi, an AI SRE that acts only when you approve." />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@300;400;500;600&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
