name: CI
on: { push: { branches: [main, develop] }, pull_request: { branches: [main, develop] } }
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.11'  # Explicit patch — see release.yml setup-go comment for the CVE rationale
          # setup-go looks for a go.sum at the repo root by default; ours live in
          # apps/api and packages/*, so the cache was never restored and every run
          # downloaded every module and compiled from scratch.
          cache-dependency-path: |
            go.work.sum
            apps/api/go.sum
            packages/*/go.sum
      - name: Build
        run: cd apps/api && go build ./...
      - name: Vet
        run: cd apps/api && go vet ./...
      - name: Test
        run: cd apps/api && go test ./... -race -count=1
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: '22', cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - name: Install
        run: cd apps/web && npm ci
      - name: Test
        run: cd apps/web && npm test
      - name: Build
        run: cd apps/web && npm run build
  alert-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The rules in the chart (files/kubebolt-alerts.yaml) against their unit
      # tests. promtool from the official image, pinned.
      - name: Test the alert rules
        run: docker run --rm -v "$PWD":/w -w /w --entrypoint promtool prom/prometheus:v3.5.0 test rules deploy/prometheus/kubebolt-alerts.test.yaml
