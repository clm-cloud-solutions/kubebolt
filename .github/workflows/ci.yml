name: CI
on: { push: { branches: [main, develop] }, pull_request: { branches: [main, develop] } }
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with: { go-version: '1.26.9' }  # Explicit patch — see release.yml setup-go comment for the CVE rationale
      - name: Build
        run: cd apps/api && go build ./...
      - name: Vet
        run: cd apps/api && go vet ./...
      - name: Test
        run: cd apps/api && go test ./... -race -count=1
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: '22' }
      - name: Install
        run: cd apps/web && npm ci
      - name: Test
        run: cd apps/web && npm test
      - name: Build
        run: cd apps/web && npm run build
  alert-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The rules in the chart (files/kubebolt-alerts.yaml) against their unit
      # tests. promtool from the official image, pinned.
      - name: Test the alert rules
        run: docker run --rm -v "$PWD":/w -w /w --entrypoint promtool prom/prometheus:v3.5.0 test rules deploy/prometheus/kubebolt-alerts.test.yaml
