{{- if .Values.gatewayAPI.enabled }}
# api.kubebolt.io → the API Service (HTTP/REST + WebSocket). WebSocket upgrade
# works over an HTTPRoute with no extra config. When the UI is served off-cluster
# (Vercel, web.enabled=false) this is the only HTTP entry point.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "kubebolt.fullname" . }}-api
  labels:
    {{- include "kubebolt.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ include "kubebolt.fullname" . }}
      sectionName: api-https
  hostnames:
    - {{ .Values.gatewayAPI.api.host | quote }}
  rules:
      # No per-request timeout cap by default (0s) — the Copilot SSE stream runs
      # for multiple tool-calling rounds; Envoy Gateway's 15s route default cuts
      # it mid-turn ("Load failed"). WebSocket upgrades are exempt; idle streams
      # are still bounded by stream_idle_timeout + the SSE heartbeat.
    - timeouts:
        request: {{ .Values.gatewayAPI.api.requestTimeout | default "0s" | quote }}
      backendRefs:
        {{- if .Values.web.enabled }}
        - name: {{ include "kubebolt.fullname" . }}
          port: {{ .Values.service.port }}
        {{- else }}
        - name: {{ include "kubebolt.fullname" . }}-api
          port: {{ .Values.api.port }}
        {{- end }}
{{- end }}
