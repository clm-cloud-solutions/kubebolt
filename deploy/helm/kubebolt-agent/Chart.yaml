apiVersion: v2
name: kubebolt-agent
description: KubeBolt agent — outbound-only agent that connects a cluster to KubeBolt. Kubelet and Hubble metrics, optional reads from an existing Prometheus, and a tunneled Kubernetes API proxy with metrics/reader/operator RBAC tiers
type: application
version: 1.4.1
appVersion: "1.4.1"
home: https://github.com/clm-cloud-solutions/kubebolt
icon: https://raw.githubusercontent.com/clm-cloud-solutions/kubebolt/main/docs/images/kubebolt-icon.png
sources:
  - https://github.com/clm-cloud-solutions/kubebolt
maintainers:
  - name: clm-cloud-solutions
    url: https://github.com/clm-cloud-solutions
keywords:
  - kubernetes
  - monitoring
  - observability
  - agent
  - daemonset
  - metrics
  - prometheus
  - cilium
  - hubble
  - opencost
  - multi-cluster
  - kubebolt
annotations:
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: GitHub
      url: https://github.com/clm-cloud-solutions/kubebolt
  artifacthub.io/containsSecurityUpdates: "true"

# Optional OpenCost sub-chart, installed only when opencost.enabled=true
# (off by default). The version is pinned exactly; upgrades are reviewed
# and security-scanned as part of the KubeBolt release process.
dependencies:
  - name: opencost
    version: "2.5.25"
    repository: "https://opencost.github.io/opencost-helm-chart"
    condition: opencost.enabled
